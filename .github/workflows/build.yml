name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore UnnamedTrackingPlaynite.sln

      - name: Build
        run: dotnet build UnnamedTrackingPlaynite.sln --configuration Release --no-restore

      - name: Validate extension output
        shell: pwsh
        run: ./tests/validate-extension.ps1 -ExtensionDirectory "src/UnnamedTrackingPlaynite/bin/Release/net462"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: unnamed-tracking-playnite
          path: src/UnnamedTrackingPlaynite/bin/Release/net462/
