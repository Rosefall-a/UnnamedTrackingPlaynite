name: Build Playnite extension

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore src/UnnamedTrackingPlaynite/UnnamedTrackingPlaynite.csproj

      - name: Build
        run: dotnet build src/UnnamedTrackingPlaynite/UnnamedTrackingPlaynite.csproj --configuration Release --no-restore

      - name: Package PEXT
        shell: pwsh
        run: |
          $projectDir = Join-Path $env:GITHUB_WORKSPACE 'src/UnnamedTrackingPlaynite'
          $outputDir = Join-Path $projectDir 'bin/Release/net462'
          $packageDir = Join-Path $env:RUNNER_TEMP 'pext'

          if (-not (Test-Path $outputDir)) {
            throw "Build output directory was not found: $outputDir"
          }

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item (Join-Path $outputDir 'UnnamedTrackingPlaynite.dll') $packageDir
          Copy-Item (Join-Path $projectDir 'extension.yaml') $packageDir

          $versionLine = Get-Content (Join-Path $projectDir 'extension.yaml') |
            Where-Object { $_ -match '^Version:\s*(.+)$' } |
            Select-Object -First 1
          if (-not $versionLine) {
            throw 'Could not determine extension version from extension.yaml.'
          }

          $version = ($versionLine -replace '^Version:\s*', '').Trim()
          $packagePath = Join-Path $env:GITHUB_WORKSPACE "UnnamedTrackingPlaynite-$version.pext"

          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath $packagePath -Force
          Write-Host "Created $packagePath"

      - name: Validate PEXT contents
        shell: pwsh
        run: |
          $package = Get-ChildItem "UnnamedTrackingPlaynite-*.pext" | Select-Object -First 1
          if (-not $package) {
            throw "PEXT package was not created."
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "pext-validate"
          if (Test-Path $extractDir) {
            Remove-Item $extractDir -Recurse -Force
          }
          Expand-Archive -Path $package.FullName -DestinationPath $extractDir -Force
          ./tests/validate-extension.ps1 -ExtensionDirectory $extractDir

      - name: Upload PEXT artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnnamedTrackingPlaynite-PEXT
          path: UnnamedTrackingPlaynite-*.pext
          if-no-files-found: error
          retention-days: 30

      - name: Publish dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build-${{ github.run_number }}
          name: Dev Build #${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: UnnamedTrackingPlaynite-*.pext

  runtime-load:
    name: Playnite runtime load test
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build plugin
        run: dotnet build src/UnnamedTrackingPlaynite/UnnamedTrackingPlaynite.csproj --configuration Release

      - name: Install latest Playnite
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'UnnamedTrackingPlaynite-CI' }
          $release = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/JosefNemec/Playnite/releases/latest'
          $asset = @($release.assets | Where-Object { $_.name -match '^Playnite\d+\.exe$' } | Select-Object -First 1)
          if ($asset.Count -eq 0) {
            throw "No Playnite offline installer was found in release $($release.tag_name)."
          }

          Write-Host "Installing Playnite $($release.tag_name) from $($asset[0].name)"
          Invoke-WebRequest -Headers $headers -Uri $asset[0].browser_download_url -OutFile "$env:RUNNER_TEMP\playnite-setup.exe"

          $playniteDir = "$env:RUNNER_TEMP\playnite"
          New-Item -ItemType Directory -Force -Path $playniteDir | Out-Null
          $installer = Start-Process -FilePath "$env:RUNNER_TEMP\playnite-setup.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$playniteDir") -Wait -PassThru -NoNewWindow
          if ($installer.ExitCode -ne 0) {
            throw "Playnite installer exited with code $($installer.ExitCode)."
          }

          $exe = Get-ChildItem $playniteDir -Filter 'Playnite.DesktopApp.exe' -Recurse | Select-Object -First 1
          if (-not $exe) {
            throw "Playnite.DesktopApp.exe was not found after installation."
          }
          "PLAYNITE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install extension into isolated Playnite data directory
        shell: pwsh
        run: |
          $dataDir = "$env:RUNNER_TEMP\playnite-data"
          $extensionDir = Join-Path $dataDir 'Extensions\UnnamedTrackingPlaynite'
          New-Item -ItemType Directory -Force -Path $extensionDir | Out-Null
          Copy-Item 'src/UnnamedTrackingPlaynite/bin/Release/net462/UnnamedTrackingPlaynite.dll' $extensionDir
          Copy-Item 'src/UnnamedTrackingPlaynite/extension.yaml' $extensionDir
          "PLAYNITE_DATA=$dataDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Start Playnite and verify extension loading
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:PLAYNITE_EXE -ArgumentList @('--userdatadir', $env:PLAYNITE_DATA, '--startdesktop', '--nolibupdate', '--hidesplashscreen') -PassThru
          try {
            Start-Sleep -Seconds 30

            if ($process.HasExited) {
              throw "Playnite exited during extension load test with exit code $($process.ExitCode)."
            }

            $logPaths = @(
              (Join-Path $env:PLAYNITE_DATA 'playnite.log'),
              (Join-Path $env:PLAYNITE_DATA 'extensions.log'),
              (Join-Path $env:PLAYNITE_DATA 'Logs\playnite.log'),
              (Join-Path $env:PLAYNITE_DATA 'Logs\extensions.log')
            )

            $logs = @()
            foreach ($path in $logPaths) {
              if (Test-Path $path) {
                Write-Host "===== $path ====="
                $content = Get-Content $path
                $content | Write-Host
                $logs += $content
              }
            }

            if ($logs.Count -eq 0) {
              throw "Playnite produced no readable logs in the isolated data directory."
            }

            $joined = $logs -join [Environment]::NewLine
            if ($joined -match '(?i)Unnamed Tracking plugin loaded') {
              Write-Host 'Confirmed: Unnamed Tracking plugin startup was logged.'
            }
            elseif ($joined -match '(?i)(failed to load|could not load|load error|exception).*UnnamedTrackingPlaynite|UnnamedTrackingPlaynite.*(failed to load|could not load|load error|exception)') {
              throw 'Playnite reported an UnnamedTrackingPlaynite load failure. See logs above.'
            }
            else {
              throw 'Playnite started, but no Unnamed Tracking plugin startup message was found.'
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }
