name: Build Playnite extension

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'v*'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore src/UnnamedTrackingPlaynite/UnnamedTrackingPlaynite.csproj

      - name: Build
        run: dotnet build src/UnnamedTrackingPlaynite/UnnamedTrackingPlaynite.csproj --configuration Release --no-restore

      - name: Package and validate PEXT
        shell: pwsh
        run: ./pack.ps1 -NoBuild

      - name: Test package validation
        shell: pwsh
        run: ./tests/test-packaging.ps1

      - name: Upload PEXT artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnnamedTrackingPlaynite-PEXT
          path: artifacts/UnnamedTrackingPlaynite-*.pext
          if-no-files-found: error
          retention-days: 30

      - name: Determine release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $versionLine = Get-Content 'src/UnnamedTrackingPlaynite/extension.yaml' |
            Where-Object { $_ -match '^Version:\s*(.+)$' } |
            Select-Object -First 1
          if (-not $versionLine) {
            throw 'Could not determine extension version from extension.yaml.'
          }

          $version = ($versionLine -replace '^Version:\s*', '').Trim()
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cne "v$version") { throw "Release tag must match the extension version v$version." }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: false
          generate_release_notes: true
          files: artifacts/UnnamedTrackingPlaynite-*.pext
